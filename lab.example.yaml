# Directory Auditor lab — copy to lab.yaml and edit (the UI can edit it too).
# Runs on the Hyper-V host. You supply the install ISOs; the panel builds the
# tool, creates/provisions the VMs, and scans every target FROM the dedicated
# non-domain-joined scanner VM (kind: linux-scanner).
#
# Each Linux target is provisioned with its VENDOR's own directory packages:
#   alt-domen / red-adm -> vendor Samba-DC (ALT task-samba-dc / RED OS Samba DC)
#   ald-pro             -> ALD Pro (aldpro-mp + aldpro-server-install, FreeIPA)
# No upstream/generic Samba or FreeIPA is ever installed.
name: dirauditor-lab
switch: da-lab               # Hyper-V *internal* switch (isolated, no uplink)
subnet: 10.55.0.0/24         # informational
repo_dir: C:\src\directory-auditor   # local clone to build from
ref: main                    # default git ref to build (branch, tag or commit)
work_dir: C:\lab\work        # builds, unattend files and reports land here

machines:
  - name: DA-DC-2022
    kind: windows-dc
    iso: C:\iso\WinServer2022_Eval.iso
    domain: da.test
    ip: 10.55.0.10
    forest_mode: Win2016
    expect: testdata/lab/windows-expect.yaml
    cpu: 2
    mem_gb: 4
    disk_gb: 60

  - name: DA-DC-2025
    kind: windows-dc
    iso: C:\iso\WinServer2025_Eval.iso
    domain: da.test
    ip: 10.55.0.11
    forest_mode: Win2025
    expect: testdata/lab/windows-expect.yaml
    cpu: 2
    mem_gb: 4
    disk_gb: 60

  - name: DA-ALT-DOMEN
    kind: alt-domen            # Альт Домен — a Samba AD DC on Alt Server
    iso: C:\iso\alt-domain.iso
    domain: alt.test
    ip: 10.55.0.12
    expect: testdata/lab/samba-expect.yaml
    cpu: 2
    mem_gb: 4
    disk_gb: 40

  - name: DA-REDADM
    kind: red-adm              # РЕД АДМ (RED OS) — Samba DC-based (FreeIPA not supported)
    iso: C:\iso\red-adm.iso    # provisioned with the RED OS vendor Samba-DC packages
    domain: red.test
    ip: 10.55.0.13
    expect: testdata/lab/samba-expect.yaml
    cpu: 2
    mem_gb: 4
    disk_gb: 40

  - name: DA-ALDPRO
    kind: ald-pro              # ALD Pro (Astra) — FreeIPA-based
    iso: C:\iso\ald-pro.iso    # aldpro-mp + aldpro-server-install stands up the domain
    domain: ald.test
    ip: 10.55.0.14
    expect: testdata/lab/freeipa-admin-expect.yaml
    cpu: 2
    mem_gb: 6
    disk_gb: 50

  # The auditor. A small Linux VM that is NOT domain-joined; every scan runs
  # from here against each DC over the network. Needs key-based SSH (root@ip)
  # and openssl (to pin each target's LDAPS cert). Any small Linux ISO works.
  - name: DA-SCANNER
    kind: linux-scanner
    iso: C:\iso\alt-workstation.iso
    ip: 10.55.0.9
    cpu: 2
    mem_gb: 2
    disk_gb: 20
